[project]
name = "context"
authors = [
    { name = "Waleed AboHashima", email = "waleedsabry.abohashima@gmail.com"}
]
description = "Context — connect any AI agent to Frappe and ERPNext over MCP"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    # None. Context speaks MCP over Frappe's own request cycle and uses nothing
    # that is not already in the bench — deliberately, because a dependency here
    # is a dependency every site that installs this app inherits.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Cloud reads this to decide whether the app is installable against a
# given bench. Context only touches the REST-facing parts of the framework —
# whitelisting, permissions, and DocType metadata — which have been stable
# across v14, v15 and v16, so the range is wide on purpose.
[tool.bench.frappe-dependencies]
frappe = ">=14.0.0,<17.0.0"
